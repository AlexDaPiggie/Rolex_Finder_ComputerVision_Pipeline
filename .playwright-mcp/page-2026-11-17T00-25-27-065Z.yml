            - row [ref=f2e51]:
              - cell "Real photos from Wikimedia Commons and Flickr (273)" [ref=f2e52]
              - cell "71% right family" [ref=f2e53]
        - paragraph [ref=f2e54]: "Real photos are harder: wrists, shop windows, angles and glare. The model is weakest on Oyster Perpetual and President, and it sometimes mixes up Submariner and Sea-Dweller. Variants were only measured well on shop photos. Treat every answer as the closest estimate, then check it with Google Images or a dealer."
