              - cell "96% right family" [ref=f3e50]
            - row [ref=f3e51]:
              - cell "Real photos from Wikimedia Commons and Flickr (273)" [ref=f3e52]
              - cell "71% right family" [ref=f3e53]
        - paragraph [ref=f3e54]: "Real photos are harder: wrists, shop windows, angles and glare. The model is weakest on Oyster Perpetual and President, and it sometimes mixes up Submariner and Sea-Dweller. Variants were only measured well on shop photos. Treat every answer as the closest estimate, then check it with Google Images or a dealer."
