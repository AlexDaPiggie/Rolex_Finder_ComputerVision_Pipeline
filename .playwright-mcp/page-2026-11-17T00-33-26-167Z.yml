      - paragraph [ref=f3e36]: Paste or drop a photo on the left, or try a sample. You get the model family and the closest reference numbers.
      - generic [ref=f3e37]:
        - heading "How it works" [level=3] [ref=f3e38]
        - generic [ref=f3e39]:
          - generic [ref=f3e40]:
            - paragraph [ref=f3e41]: A detector finds the watch in your photo and crops the dial. A vision model (CLIP) turns the crop into a set of numbers. A small trained layer picks the family, such as Submariner or Datejust.
            - paragraph [ref=f3e42]: The same numbers are then compared with the catalog of 95 variants, so the answer comes with reference numbers you can search. A first scan can take up to 45 seconds while the server wakes up. After that it takes about a second.
          - 'img "Result page for a sample photo: family name, a Strong match label, and the closest variants with reference numbers" [ref=f3e43]'
      - generic [ref=f3e44]:
        - heading "How well it works" [level=3] [ref=f3e45]
        - table [ref=f3e46]:
          - rowgroup [ref=f3e47]:
